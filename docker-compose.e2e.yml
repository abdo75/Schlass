# Overlay applied on top of docker-compose.yml when running Playwright E2E
# tests (see `make e2e` and the `e2e` CI job). Raises the /api/login rate
# limit high enough that the lockout test can submit 5 failed attempts + 1
# correct attempt without being rate-limited. Do NOT use this overlay in
# production or dev.
services:
  app:
    environment:
      SCHLASS_LOGIN_RATE_LIMIT: "1000"
      SCHLASS_MFA_CHALLENGE_RATE_LIMIT: "1000"
      # Developer-mode OIDC client seeding. The E2E Playwright specs rely
      # on a known-secret dev-test-client being present at /authorize. The
      # SCHLASS_DEV_SECRET is intentionally deterministic so tests can
      # compute client_secret_post bodies without scraping container logs.
      SCHLASS_DEV: "1"
      SCHLASS_DEV_SECRET: "e2e-deterministic-secret-do-not-ship"
