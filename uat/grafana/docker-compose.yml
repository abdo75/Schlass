services:
  grafana:
    image: grafana/grafana-oss:11.5.0
    container_name: uat-grafana
    ports:
      - "3001:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GF_SERVER_ROOT_URL: http://localhost:3001/

      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Schlass
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: 915a8ebc-8335-48ea-88eb-0259d888ea09
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: I5NaJT2VZR0CDGsqfka5uI3pghVJ57cjiT7ZldEZJeo
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email

      # Browser hits Schlass at localhost:3000.
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: http://localhost:3000/authorize
      # Grafana's server-side calls Schlass via the host bridge.
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: http://host.docker.internal:3000/token
      GF_AUTH_GENERIC_OAUTH_API_URL: http://host.docker.internal:3000/userinfo

      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: email
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: name

      GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN: "false"
      # Schlass doesn't emit a role claim; let Grafana assign its default role
      # (Viewer) to first-time users instead of refusing login.
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "false"
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"

      # OAuth 2.1 requires PKCE S256 on every authorization_code flow —
      # Schlass rejects non-PKCE /authorize with invalid_request. Grafana's
      # generic oauth client supports PKCE but it's off by default.
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
