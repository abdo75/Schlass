name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR so rapid pushes don't stack
# full ~11-min runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install frontend deps
        run: cd web && npm ci

      - name: Go lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest

      - name: Frontend lint
        run: cd web && npx eslint src/ --max-warnings=0

      - name: Frontend tests
        run: cd web && npx vitest run

  test:
    name: Test (${{ matrix.tier }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tier: [unit, integration]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Unit tests
        if: matrix.tier == 'unit'
        run: make test-unit

      - name: Integration tests
        if: matrix.tier == 'integration'
        run: make test-integration

  # E2E builds its own Docker stack, so it depends on nothing the test or
  # lint jobs produce. Running it in parallel from t=0 means the overall
  # workflow wall-clock is max(lint, test matrix, e2e) rather than the
  # sum of test + e2e.
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        run: cd web && npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install Playwright browsers
        run: cd web && npx playwright install --with-deps chromium

      - name: Create .env for docker compose
        run: |
          cp .env.example .env
          key=$(openssl rand -base64 32)
          sed -i "s|SCHLASS_ENCRYPTION_KEY=.*|SCHLASS_ENCRYPTION_KEY=$key|" .env

      - name: Start docker compose
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up --build -d

      - name: Wait for app to be healthy
        run: ./scripts/wait-for-health.sh

      - name: Run Playwright tests
        run: cd web && npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

      - name: Dump docker logs on failure
        if: failure()
        run: docker compose logs
