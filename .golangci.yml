version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gosec
    - bodyclose
    - noctx

linters-settings:
  gosec:
    excludes:
      - G104  # unhandled errors on deferred Close() calls are acceptable

issues:
  exclude-dirs:
    - internal/web/dist
