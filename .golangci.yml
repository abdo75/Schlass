version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gosec
    - bodyclose
    - noctx
  settings:
    gosec:
      excludes:
        - G104  # unhandled errors on deferred Close() calls are acceptable
  exclusions:
    paths:
      - internal/web/dist
